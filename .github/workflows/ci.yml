name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:ci

      - name: Build
        run: pnpm run build

      - name: Validate package exports
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
          test -f dist/bootstrap/index.js
          test -f dist/bootstrap/index.d.ts
          test -f dist/integrations/vercel-ai-sdk/index.js
          test -f dist/integrations/vercel-ai-sdk/index.d.ts
          test -f dist/integrations/openai/index.js
          test -f dist/integrations/openai/index.d.ts
          test -f dist/integrations/openai/instrumentation.js
          test -f dist/integrations/openai/instrumentation.d.ts
          test -f dist/integrations/anthropic/index.js
          test -f dist/integrations/anthropic/index.d.ts
          test -f dist/integrations/langchain/index.js
          test -f dist/integrations/langchain/index.d.ts
          echo "All export entry points present."

  # The dev install uses recent OpenTelemetry packages. This job runs the tests
  # against the lowest versions our peer ranges allow, so code that relies on a
  # newer API fails here instead of on users' machines.
  compat-otel-min:
    name: Compat (lowest OpenTelemetry peer versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pin OpenTelemetry packages to 0.200.0
        run: |
          pnpm add -D \
            @opentelemetry/instrumentation@0.200.0 \
            @opentelemetry/exporter-trace-otlp-http@0.200.0 \
            @opentelemetry/exporter-metrics-otlp-http@0.200.0
          pnpm ls @opentelemetry/instrumentation \
            @opentelemetry/exporter-trace-otlp-http \
            @opentelemetry/exporter-metrics-otlp-http

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:ci

  # Single stable check for branch-protection to require. Gating on the matrix
  # jobs directly means the required-check names ("Test (Node 22)", ...) are
  # literal strings in the ruleset that silently go stale whenever the matrix
  # changes — and a required check that never reports blocks merges forever.
  # Requiring only this job keeps the matrix free to change.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [test, compat-otel-min]
    # `always()` is load-bearing: without it this job is *skipped* when the
    # matrix fails, and GitHub counts a skipped required check as passing.
    # Because it always runs, the result must be asserted explicitly.
    if: always()
    steps:
      - name: Verify all matrix jobs succeeded
        run: |
          echo "test result: ${{ needs.test.result }}"
          echo "compat result: ${{ needs.compat-otel-min.result }}"
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::One or more Test (Node ...) jobs did not succeed."
            exit 1
          fi
          if [ "${{ needs.compat-otel-min.result }}" != "success" ]; then
            echo "::error::The lowest OpenTelemetry peer versions compat job did not succeed."
            exit 1
          fi
